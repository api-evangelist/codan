name: Codan

description: 'Codan Limited (ASX: CDA) is an Adelaide, Australia-headquartered global technology group, founded in 1959, building trusted communications, detection and connection solutions for defence forces, public safety agencies, humanitarian organisations and consumers. Its businesses include DTC (secure mission-critical communications for defence, public safety, broadcast and unmanned systems), Minelab (metal detection for gold prospecting, coin and treasure hunting and countermine) and Zetron (Next Generation 911 and command-and-control for public safety and critical infrastructure). No public developer portal or API documentation was found on codan.com.au.'

